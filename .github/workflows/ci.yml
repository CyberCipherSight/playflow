name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: make check PYTHON=python
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,browser,publish]'
      - run: make dist PYTHON=python
      - run: |
          python -m venv /tmp/playflow-wheel
          /tmp/playflow-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/playflow-wheel/bin/playflow --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: playflow --help
      - run: python -m unittest discover -s tests -p test_distribution_export.py
      - shell: pwsh
        run: |
          python tools/install_skill.py --destination "$env:RUNNER_TEMP/playflow-publish"
          python "$env:RUNNER_TEMP/playflow-publish/scripts/doctor.py" --help
